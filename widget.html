<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플래너 위젯</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191919">
<link rel="manifest" href="widget.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<header><b id="today"></b><span class="clock" id="clock"></span><a class="planner" href="./" target="_blank" rel="noopener">플래너 열기 ↗</a></header>
<div id="login" class="hidden"><b>팔로 플래너 로그인</b>
  <form id="lform"><input id="lemail" type="email" placeholder="이메일" autocomplete="email" required><input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <button class="lbtn" type="submit">로그인</button><div id="lmsg"></div></form>
  <small>처음이면 <a class="planner" href="./" target="_blank" rel="noopener">플래너</a>에서 가입하세요</small></div>
<main id="main" class="hidden">
  <div class="sum" id="sum"></div>
  <section id="sRoutine"><h2>📌 고정업무 <small id="rtN"></small></h2><div class="bar"><i id="rtBar"></i></div><div class="list" id="rtList"></div></section>
  <section id="sToday"><h2>✅ 오늘 할 일 <small id="tdN"></small></h2><form id="addForm" class="list"><input id="addInput" placeholder="+ 오늘 할 일 추가 (Enter)" autocomplete="off" maxlength="300"></form><div class="list" id="tdList"></div></section>
  <section id="sDue"><h2>⏰ 다가오는 데드라인 <small>48시간</small></h2><div class="list" id="dueList"></div></section>
</main>
<footer id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="week.js"></script>
<script src="widget.js"></script>
</body>
</html>

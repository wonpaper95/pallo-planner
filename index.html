<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔로 플래너</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191919">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root {
  --bg: #191919; --panel: #202020; --line: #2f2f2f; --hover: #2a2a2a; --text: #e6e6e6; --sub: #9b9b9b;
  --blue: #2383e2; --red: #eb5757; --orange: #e9a23b; --green: #4dab9a; --accent: #8b6fd6;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #ffffff; --panel: #f7f7f5; --line: #e9e9e7; --hover: #efefed; --text: #37352f; --sub: #787774; --accent: #493087; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
.hidden { display: none !important; }

/* 로그인 */
#auth { max-width: 360px; margin: 12vh auto; padding: 0 16px; }
#auth h1 { font-size: 26px; margin: 0 0 4px; }
#auth p { color: var(--sub); margin: 0 0 24px; }
#auth input { width: 100%; padding: 12px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.btn { padding: 10px 14px; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
#auth .btn { width: 100%; margin-top: 4px; }
#auth .msg { color: var(--red); min-height: 22px; font-size: 14px; }

/* 상단 */
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
header .logo { font-weight: 700; margin-right: auto; }
header .btn { padding: 6px 10px; font-size: 14px; white-space: nowrap; }
#me { color: var(--sub); font-size: 13px; }

.layout { display: grid; grid-template-columns: 260px 1fr; max-width: 1200px; margin: 0 auto; }
aside { border-right: 1px solid var(--line); padding: 16px 12px; height: calc(100vh - 106px); position: sticky; top: 106px; overflow: auto; }
aside .yr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
aside .yr button { padding: 2px 8px; color: var(--sub); }
.wk { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; }
.wk:hover { background: var(--hover); }
.wk.on { background: var(--hover); box-shadow: inset 3px 0 var(--accent); }
.wk b { font-weight: 600; } .wk small { color: var(--sub); margin-left: 6px; }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

main { padding: 20px 24px 120px; min-width: 0; }
.weekhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.weekhead h1 { font-size: 28px; margin: 0; }
.weekhead .nav { font-size: 20px; color: var(--sub); padding: 0 6px; }
.weekhead .range { color: var(--sub); font-size: 14px; }
.rate { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 14px; margin: 6px 0 18px; }
.rate .bar { flex: 1; max-width: 240px; margin: 0; height: 6px; }

/* 표시: 🔥 꼭 / ⭐ 중요 / 우선순위 */
.mk { font-size: 12px; padding: 1px 7px; border-radius: 99px; white-space: nowrap; cursor: pointer; border: 1px solid var(--line); color: var(--sub); }
.mk.must { color: #fff; background: #ff4d4f; border-color: #ff4d4f; }
.mk.must.late { background: #8f1d21; border-color: #ff6b6b; }
.mk.imp { color: #fff; background: #ff4d4f; border-color: #ff4d4f; }
.row.done .mk { opacity: .45; }
/* 중요·오늘 꼭 → 밝은 빨간색 */
.row.hot:not(.done) { box-shadow: inset 3px 0 #ff4d4f; background: color-mix(in srgb, #ff4d4f 9%, transparent); }
.row.hot:not(.done) textarea { color: #ff4d4f; font-weight: 700; }
.quick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.mgrid .pill.hot { background: color-mix(in srgb, #ff4d4f 30%, transparent); color: #ff6b6b; font-weight: 700; }
/* 데드라인 모아보기 */
#mustbox, #duebox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 22px; background: var(--panel); }
#mustbox { border-color: #e5484d66; margin-bottom: 10px; }
#mustbox summary, #duebox summary { cursor: pointer; font-weight: 600; }
#mustbox .dl-item, #duebox .dl-item { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; }
#mustbox .dl-item:first-of-type, #duebox .dl-item:first-of-type { border-top: 0; }
#mustbox .dl-item span:first-child, #duebox .dl-item span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 요일 칸 (노션 MON~SUN) */
.day { margin-bottom: 26px; scroll-margin-top: 112px; }
.day h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 20px; letter-spacing: .02em; }
.day h3 .pill { font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--hover); color: var(--text); font-weight: 600; }
.day h3 small { color: var(--sub); font-size: 13px; font-weight: 400; }
.day h3 .dbar { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.day h3 .dbar i { display: block; height: 100%; background: var(--green); }
.day.sat h3 > span:first-child { color: var(--blue); } .day.sun h3 > span:first-child { color: var(--red); }
.day.today h3 .pill { background: var(--accent); color: #fff; }
.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 18px 24px minmax(0, 1fr) auto 28px; align-items: start; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.grip { cursor: grab; color: var(--sub); opacity: .3; font-size: 15px; line-height: 24px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.row:hover .grip { opacity: 1; }
.meta { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.tm { font-size: 13px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line); color: var(--sub); font-variant-numeric: tabular-nums; }
.tm b { font-weight: 600; color: var(--text); }
.tm.run { background: var(--green); border-color: var(--green); color: #fff; } .tm.run b { color: #fff; }
.tm.over { background: var(--red); border-color: var(--red); color: #fff; } .tm.over b { color: #fff; }
.row:not(:hover) .tm.none { opacity: 0; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; padding: 6px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dragging { opacity: .35; }
.day.drop { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 6px; }
.mgrid .dc.drop { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.drop-line { height: 3px; margin: -2px 0; background: var(--accent); border-radius: 2px; }
.timerline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timerline b { font-size: 20px; font-variant-numeric: tabular-nums; }
.timerline input { width: 130px !important; }
.row:hover { background: var(--hover); }
.row input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0 2px; accent-color: var(--blue); cursor: pointer; }
.row textarea { width: 100%; resize: none; border: 0; background: transparent; padding: 0; line-height: 1.5; overflow: hidden; outline: none; min-height: 22px; }
.row.done textarea { color: var(--sub); }
.row .more { color: var(--sub); font-size: 18px; line-height: 22px; border-radius: 4px; }
.row .more:hover { background: var(--line); }
.chip { font-size: 13px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line); color: var(--sub); }
.chip.ok { color: var(--text); }
.chip.soon { color: #fff; background: var(--orange); border-color: var(--orange); }
.chip.over { color: #fff; background: var(--red); border-color: var(--red); }
.chip.fin { text-decoration: line-through; }
.chip .log { opacity: .85; margin-left: 4px; }
.row:not(:hover) .chip.none { opacity: 0; }
.add { color: var(--sub); padding: 6px 8px; width: 100%; text-align: left; border-radius: 6px; }
.add:hover { background: var(--hover); }

/* 월 달력 */
/* 주간 | 월간 전환 탭 */
.seg { position: sticky; top: 53px; z-index: 4; display: flex; justify-content: center; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.seg div { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { padding: 7px 26px; border-radius: 8px; font-weight: 600; color: var(--sub); }
.seg button.on { background: var(--hover); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
/* 월간 보기 (애플 캘린더 모양) */
body.mv .layout { display: none; }
body:not(.mv) #monthView { display: none; }
.mview { max-width: 1400px; margin: 0 auto; padding: 16px 20px 80px; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mh h1 { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
.mh .navs { display: flex; gap: 8px; }
.mh .navs button { min-width: 36px; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--hover); font-size: 15px; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mgrid .dow { text-align: center; font-size: 16px; color: var(--sub); padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
.mgrid .dc { min-height: max(120px, calc((100vh - 190px) / 6)); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px 4px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.mgrid .dc:nth-child(7n) { border-right: 0; }
.mgrid .dc:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.mgrid .dc.wkend { background: color-mix(in srgb, var(--panel) 70%, transparent); }
.mgrid .dn { text-align: right; font-size: 20px; font-weight: 600; padding: 0 4px 2px; }
.mgrid .dc.out .dn { color: var(--sub); opacity: .7; }
.mgrid .dn b { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #ff3b30; color: #fff; }
.mgrid .pill { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; display: block; width: 100%; text-align: left; font-size: 13px; line-height: 1.35; padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: color-mix(in srgb, #8b6fd6 38%, transparent); color: color-mix(in srgb, #c9b8ff 80%, var(--text)); }
.mgrid .pill.dl { background: color-mix(in srgb, #ff453a 32%, transparent); color: #ff8a80; }
.mgrid .pill.dl.soon { background: color-mix(in srgb, #ff9f0a 32%, transparent); color: #ffc46b; }
.mgrid .pill.x { background: color-mix(in srgb, var(--sub) 18%, transparent); color: var(--sub); text-decoration: line-through; }
.mgrid .more { font-size: 12px; color: var(--sub); padding-left: 6px; white-space: nowrap; }
@media (prefers-color-scheme: light) {
  .mgrid .pill { color: #4b2fa8; } .mgrid .pill.dl { color: #c4281c; } .mgrid .pill.dl.soon { color: #a35a00; }
}
/* 주간 화면 SUN 밑 달력: 같은 월 달력을 조금 작게 */
.mview.wcal { display: block; padding: 8px 0 0; margin-top: 10px; border-top: 1px solid var(--line); }
.wcal .mh h1 { font-size: 26px; }
.wcal .mgrid .dc { min-height: 110px; }
.wcal .mgrid .dn { font-size: 16px; }
.wcal .mgrid .dn b { width: 28px; height: 28px; }

/* 상세 시트 */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); width: min(480px, calc(100vw - 24px)); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 4px; }
dialog input:not([type=checkbox]), dialog select, dialog textarea { width: 100%; padding: 9px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
dialog .ttl { font-size: 17px; font-weight: 600; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.quick button { font-size: 13px; padding: 4px 9px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); }
.loglist { font-size: 13px; color: var(--sub); margin: 6px 0 0; padding-left: 18px; }
.sheet-foot { display: flex; justify-content: space-between; margin-top: 18px; }
.danger { color: var(--red); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }

/* 폰 */
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 106px 0 0 0; height: auto; z-index: 6; background: var(--bg); border: 0; }
  main { padding: 14px 16px 120px; }
  .weekhead h1 { font-size: 24px; }
  .row { grid-template-columns: 18px 24px minmax(0, 1fr) 28px; }
  .row .meta { grid-column: 3; grid-row: 2; justify-content: flex-start; }
  .row .more { grid-column: 4; grid-row: 1; }
  .grip { opacity: .6; font-size: 17px; }
  .row:not(:hover) .tm.none { opacity: .55; }
  .row .chip.none { display: none; }
  #me { display: none; }
  .mview { padding: 10px 8px 80px; }
  .mview .mh h1 { font-size: 24px; }
  .mgrid .dc { min-height: 92px; padding: 3px 2px; }
  .mgrid .dn { font-size: 13px; }
  .mgrid .dn b { width: 24px; height: 24px; }
  .mgrid .il { display: none; }
  .wcal .mgrid .dc { min-height: 76px; }
  .wcal .mh h1 { font-size: 22px; }
  .mgrid .pill { font-size: 10.5px; padding: 1px 3px; }
  .mgrid .dow { font-size: 13px; }
  header { gap: 6px; }
  header .logo { font-size: 0; }
  header .btn { padding: 6px 9px; font-size: 13px; }
}
@media (min-width: 861px) { #weeksBtn { display: none; } }
</style>
</head>
<body>

<div id="auth" class="hidden">
  <h1>팔로 플래너</h1>
  <p>매니저 각자의 위클리 플래너</p>
  <form id="authForm">
    <input id="email" type="email" placeholder="이메일" autocomplete="email" required>
    <input id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
    <div class="msg" id="authMsg"></div>
    <button class="btn" type="submit">로그인</button>
    <button class="btn ghost" type="button" id="signup">처음이에요 — 이 이메일로 가입</button>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <button id="weeksBtn" class="btn ghost" title="주 목록">☰</button>
    <span class="logo">팔로 플래너</span>
    <span id="me"></span>
    <button id="todayBtn" class="btn ghost">오늘</button>
    <button id="pushBtn" class="btn ghost">🔔 알람 켜기</button>
    <button id="outBtn" class="btn ghost">로그아웃</button>
  </header>
  <nav class="seg"><div><button data-v="week">주간</button><button data-v="month">월간</button></div></nav>
  <div class="layout">
    <aside id="weeks" class="hidden-m"><div id="weekList"></div></aside>
    <main>
      <div class="weekhead">
        <button class="nav" id="prevW" aria-label="지난주">‹</button>
        <h1 id="wkTitle"></h1>
        <button class="nav" id="nextW" aria-label="다음주">›</button>
        <span class="range" id="wkRange"></span>
      </div>
      <div class="rate"><div class="bar"><i id="rateBar"></i></div><span id="rateTxt"></span></div>
      <details id="mustbox" open class="hidden"><summary>🔥 꼭 끝낼 일 <span id="mustCount"></span></summary><div id="mustList"></div></details>
      <details id="duebox" open><summary>⏰ 데드라인 <span id="dueCount"></span></summary><div id="dueList"></div></details>
      <div id="days"></div>
      <section class="mview wcal" id="weekCal"></section>
    </main>
  </div>
  <section class="mview" id="monthView"></section>
</div>

<dialog id="sheet">
  <input class="ttl" id="sTitle" placeholder="할 일">
  <label><input type="checkbox" id="sDone"> 완료</label>
  <label>표시</label>
  <div class="quick" id="sMarks"><button data-mk="must_do">🔥 그날 꼭 끝내기</button><button data-mk="important">⭐ 중요</button></div>
  <label for="sDay">날짜 (다른 날로 옮기기)</label>
  <input type="date" id="sDay">
  <label for="sDl" id="sDlLabel">데드라인</label>
  <input type="datetime-local" id="sDl">
  <div class="quick" id="sQuick">
    <button data-q="today18">오늘 18:00</button>
    <button data-q="tom9">내일 09:00</button>
    <button data-q="tom18">내일 18:00</button>
    <button data-q="+1d">+1일</button>
    <button data-q="+1w">+1주</button>
    <button data-q="clear">지우기</button>
  </div>
  <ul class="loglist" id="sLog"></ul>
  <label for="sRemind">알람</label>
  <select id="sRemind">
    <option value="">알람 없음</option>
    <option value="0">마감 시각에</option>
    <option value="10">10분 전</option>
    <option value="30">30분 전</option>
    <option value="60">1시간 전</option>
    <option value="180">3시간 전</option>
    <option value="1440">1일 전</option>
  </select>
  <label for="sEst">예상 소요시간 (분)</label>
  <input type="number" id="sEst" min="1" inputmode="numeric" placeholder="예: 30">
  <div class="quick" id="sEstQ">
    <button data-m="15">15분</button><button data-m="30">30분</button><button data-m="60">1시간</button>
    <button data-m="120">2시간</button><button data-m="180">3시간</button><button data-m="">지우기</button>
  </div>
  <label>업무 수행시간</label>
  <div class="timerline"><b id="sSpent">0:00:00</b><button class="btn ghost" id="sTimer">▶ 시작</button>
    <input type="number" id="sSpentEdit" min="0" inputmode="numeric" placeholder="분으로 직접 고치기"></div>
  <label for="sNote">메모</label>
  <textarea id="sNote" rows="4"></textarea>
  <div class="sheet-foot">
    <button class="danger" id="sDel">삭제</button>
    <button class="btn" id="sClose">닫기</button>
  </div>
</dialog>

<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="week.js"></script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
const KDAY = ["일", "월", "화", "수", "목", "금", "토"];
const today = () => W.ymd(new Date());

let me = null, monday = W.monday(today()), year = W.isoWeek(today()).year;
let tasks = [], dues = [], musts = [], openId = null, dirty = false;
let cal = null, calTasks = []; // 달력에 보이는 달 { y, m }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2600); }
function fail(error) { if (error) { console.error(error); toast("저장 실패: " + (error.message || error)); return true; } }
const md = (s) => { const d = W.parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
function fmtDl(iso) { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}(${KDAY[d.getDay()]}) ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
const toLocalInput = (iso) => { const d = new Date(iso); return `${W.ymd(d)}T${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

// ── 로그인 ──

$("#outBtn").onclick = async () => { await sb.auth.signOut({ scope: "local" }); location.reload(); };

// ── 불러오기 ──
async function loadAll(scrollToday) {
  const sun = W.add(monday, 6);
  const weeks = W.weeksOf(year);
  const [t, d, s, m] = await Promise.all([
    sb.from("tasks").select("*").gte("day", monday).lte("day", sun).order("sort").order("id"),
    sb.from("tasks").select("id, day, title, deadline, deadline_log").eq("done", false).not("deadline", "is", null)
      .lte("deadline", new Date(Date.now() + 7 * 86400000).toISOString()).order("deadline").limit(30),
    sb.rpc("week_stats", { from_day: weeks[0], to_day: W.add(weeks.at(-1), 6) }),
    sb.from("tasks").select("id, day, title").eq("must_do", true).eq("done", false).lte("day", today()).order("day").limit(30),
  ]);
  if (fail(t.error || d.error || s.error || m.error)) return;
  tasks = t.data; dues = d.data; musts = m.data;
  renderWeeks(Object.fromEntries(s.data.map((x) => [x.start, x])));
  renderWeek();
  const thu = W.parse(W.add(monday, 3)); // 주가 걸친 달은 목요일 기준
  if (!cal || cal.wk !== monday) cal = { y: thu.getFullYear(), m: thu.getMonth() + 1, wk: monday };
  await loadCal();
  if (scrollToday) document.getElementById("d-" + today())?.scrollIntoView({ block: "start" });
}
async function loadCal() {
  const d1 = `${cal.y}-${String(cal.m).padStart(2, "0")}-01`, a = W.add(d1, -7), b = W.add(d1, 43); // 월·일요일 시작 칸 둘 다 덮음
  const { data, error } = await sb.from("tasks").select("*")
    .or(`and(day.gte.${a},day.lte.${b}),and(deadline.gte."${W.parse(a).toISOString()}",deadline.lt."${W.parse(b).toISOString()}")`)
    .order("sort").order("id").limit(2000);
  if (fail(error)) return;
  calTasks = data;
  renderCal();
}

// 다른 기기에서 바꾸면 바로 반영 (입력 중이면 끝난 뒤)
let reloadT;
function softReload() {
  if (document.activeElement?.closest(".row, dialog") || $("#sheet").open) { dirty = true; return; }
  clearTimeout(reloadT); reloadT = setTimeout(() => loadAll(false), 300);
}
function listen() {
  sb.channel("tasks").on("postgres_changes", { event: "*", schema: "public", table: "tasks", filter: `user_id=eq.${me.id}` }, softReload).subscribe();
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && softReload());
  setInterval(() => document.visibilityState === "visible" && renderDue(), 60000); // 'n분 남음' 갱신
}

// ── 화면 ──
function renderWeeks(stats) {
  const cur = W.isoWeek(today());
  $("#weekList").innerHTML = `<div class="yr"><button id="py">‹</button>${year}<button id="ny">›</button></div>` +
    W.weeksOf(year).map((m) => {
      const s = stats[m], pct = s?.total ? Math.round((s.done / s.total) * 100) : 0, w = W.isoWeek(m).week;
      const now = cur.year === year && cur.week === w ? " ●" : "";
      return `<button class="wk ${m === monday ? "on" : ""}" data-m="${m}"><b>Week ${String(w).padStart(2, "0")}${now}</b><small>${md(m)}–${md(W.add(m, 6))}${s?.total ? ` · ${pct}%` : ""}</small><div class="bar"><i style="width:${pct}%"></i></div></button>`;
    }).join("");
  $("#weekList").querySelector(".on")?.scrollIntoView({ block: "nearest" });
}

// 월간 달력용으로 날짜별 할 일·데드라인 모으기
function renderCal() {
  const byDay = {}, dlByDay = {};
  for (const t of calTasks) {
    (byDay[t.day] ??= []).push(t);
    if (t.deadline && !t.done) (dlByDay[W.ymd(new Date(t.deadline))] ??= []).push(t);
  }
  const hm = (iso) => { const d = new Date(iso); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  renderMonth(byDay, dlByDay, hm);
}

// 월간 보기: 일요일 시작, 칸마다 알약(할 일 보라 / ⏰데드라인 빨강·주황 / 완료 회색). 알약 = 상세, 빈 곳 = 그날 새 할 일
function renderMonth(byDay, dlByDay, hm) {
  const g = W.monthGrid(cal.y, cal.m, true), max = matchMedia("(max-width: 860px)").matches ? 3 : 4;
  const cells = g.map((day) => {
    const d = W.parse(day), out = d.getMonth() + 1 !== cal.m;
    const dls = (dlByDay[day] ?? []).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
    const list = (byDay[day] ?? []).filter((t) => t.title)
      .sort((a, b) => a.done - b.done || b.must_do - a.must_do || b.important - a.important); // 꼭·중요 먼저
    const pills = [
      ...dls.map((t) => `<button class="pill dl ${W.due(t.deadline).cls}" data-id="${t.id}">⏰${hm(t.deadline)} ${esc(t.title) || "(제목 없음)"}</button>`),
      ...list.map((t) => `<button class="pill ${t.done ? "x" : ""} ${!t.done && (t.must_do || t.important) ? "hot" : ""}" data-id="${t.id}">${t.must_do ? "🔥" : ""}${t.important ? "⭐" : ""}${esc(t.title)}</button>`),
    ];
    const il = `<span class="il">일</span>`; // 폰에선 숫자만 (아이폰 캘린더처럼)
    const num = day === today() ? `<b>${d.getDate()}</b>${il}` : d.getDate() === 1 ? `<span class="il">${d.getMonth() + 1}월 </span>1${il}` : `${d.getDate()}${il}`;
    return `<div class="dc ${out ? "out" : ""} ${d.getDay() % 6 === 0 ? "wkend" : ""}" data-day="${day}"><div class="dn">${num}</div>
      ${pills.slice(0, max).join("")}${pills.length > max ? `<div class="more">+${pills.length - max}<span class="il">개 더</span></div>` : ""}</div>`;
  }).join("");
  const html = `<div class="mh"><h1>${cal.y}년 ${cal.m}월</h1><div class="navs"><button data-cal="-1" aria-label="이전 달">‹</button><button data-cal="0">오늘</button><button data-cal="1" aria-label="다음 달">›</button></div></div>
    <div class="mgrid">${["일", "월", "화", "수", "목", "금", "토"].map((x) => `<div class="dow">${x}</div>`).join("")}${cells}</div>`;
  $("#monthView").innerHTML = html; $("#weekCal").innerHTML = html;
}
$("#monthView").onclick = $("#weekCal").onclick = async (e) => {
  const nav = e.target.closest("[data-cal]");
  if (nav) {
    if (nav.dataset.cal === "0") { const t = W.parse(today()); cal = { ...cal, y: t.getFullYear(), m: t.getMonth() + 1 }; }
    else { const m = cal.m + +nav.dataset.cal; cal = { ...cal, y: cal.y + Math.floor((m - 1) / 12), m: ((m + 11) % 12) + 1 }; }
    return loadCal();
  }
  const pill = e.target.closest(".pill");
  if (pill) return openSheet(calTasks.find((t) => t.id == pill.dataset.id));
  const c = e.target.closest(".dc"); if (!c) return;
  const { data, error } = await sb.from("tasks").insert({ day: c.dataset.day }).select().single();
  if (fail(error)) return;
  calTasks.push(data); openSheet(data); $("#sTitle").focus();
};
let view = "week";
try { view = localStorage.getItem("planner-view") || "week"; } catch {}
function setView(v) {

setView(view);
$("#weekList").onclick = (e) => {

  const b = e.target.closest(".wk"); if (!b) return;
  monday = b.dataset.m; if (matchMedia("(max-width: 860px)").matches) $("#weeks").classList.add("hidden-m");
  loadAll(); window.scrollTo(0, 0);
};

function chip(t) {
  if (!t.deadline) return `<button class="chip none" data-act="dl">+ 데드라인</button>`;
  const d = W.due(t.deadline), n = (t.deadline_log || []).length;
  const cls = t.done ? "chip fin" : "chip " + d.cls;
  return `<button class="${cls}" data-act="dl" title="데드라인 재설정">📅 ${fmtDl(t.deadline)}${t.done ? "" : " · " + d.text}${n ? `<span class="log">↻${n}</span>` : ""}</button>`;
}
// ── 수행시간 / 예상시간 ──
const pad = (n) => String(n).padStart(2, "0");
const elapsed = (t) => t.spent_sec + (t.started_at ? Math.max(0, (Date.now() - new Date(t.started_at)) / 1000) : 0);
function hms(sec, withSec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return withSec ? `${h}:${pad(m)}:${pad(sec % 60)}` : `${h}:${pad(m)}`; }
function timeBtn(t) {
  const run = !!t.started_at, sec = elapsed(t), est = t.estimate_min;
  if (t.done && !sec && !est) return "";
  if (!run && !sec && !est) return `<button class="tm none" data-act="timer" title="타이머 시작">▶ 0:00</button>`;
  const over = est && sec > est * 60;
  return `<button class="tm ${run ? "run" : ""} ${over ? "over" : ""}" data-act="timer" data-tid="${t.id}" title="${t.done ? "수행시간" : run ? "타이머 정지" : "타이머 시작"}">${t.done ? "⏱" : run ? "⏸" : "▶"} <b>${hms(sec, run)}</b>${est ? ` / ${hms(est * 60)}` : ""}</button>`;
}
// 1초마다 도는 타이머만 숫자 갱신
setInterval(() => {
  document.querySelectorAll(".tm.run").forEach((el) => {
    const t = tasks.find((x) => x.id == el.dataset.tid); if (!t) return;
    el.querySelector("b").textContent = hms(elapsed(t), true);
    el.classList.toggle("over", !!(t.estimate_min && elapsed(t) > t.estimate_min * 60));
  });
  const t = openId && cur(); if (t && $("#sheet").open) $("#sSpent").textContent = hms(elapsed(t), true);
}, 1000);
async function toggleTimer(t) {
  if (t.done) return toast("완료한 일이에요");
  const { error } = await sb.rpc("timer", { p_id: t.id, p_on: !t.started_at });
  if (fail(error)) return;
  await loadAll();
  if ($("#sheet").open && openId === t.id) openSheet(cur());
}
function marks(t) {
  let h = "";
  if (t.must_do) h += `<span class="mk must ${!t.done && t.day < today() ? "late" : ""}" data-act="open" title="그날 꼭 끝내기">🔥 ${t.day === today() ? "오늘 꼭" : !t.done && t.day < today() ? "못 끝냄" : "꼭"}</span>`;
  if (t.important) h += `<span class="mk imp" data-act="open" title="중요">⭐ 중요</span>`;
  return h;
}
function rowHtml(t) {
  return `<div class="row ${t.done ? "done" : ""} ${t.important || t.must_do ? "hot" : ""}" data-id="${t.id}">
    <span class="grip" aria-label="끌어서 다른 날로 옮기기" title="끌어서 옮기기">⠿</span>
    <input type="checkbox" ${t.done ? "checked" : ""} aria-label="완료">
    <textarea rows="1" placeholder="할 일 입력">${esc(t.title)}</textarea>
    <div class="meta">${marks(t)}${timeBtn(t)}${chip(t)}</div>
    <button class="more" data-act="open" aria-label="자세히">⋯</button></div>`;
}
// 요일 옆 완료율 (주 목록 막대와 같은 모양)
function dayRate(list) {
  if (!list.length) return "";
  const done = list.filter((t) => t.done).length, pct = Math.round((done / list.length) * 100);
  return `<span class="dbar"><i style="width:${pct}%"></i></span><small>${pct}% (${done}/${list.length})</small>`;
}
function renderWeek() {
  const wk = W.isoWeek(monday);
  $("#wkTitle").textContent = `Week ${String(wk.week).padStart(2, "0")}`;
  $("#wkRange").textContent = `${monday.replaceAll("-", "/")} → ${W.add(monday, 6).replaceAll("-", "/")}`;
  const done = tasks.filter((t) => t.done).length, pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
  $("#rateBar").style.width = pct + "%";
  $("#rateTxt").textContent = `이번주 완료율 ${pct}% (${done}/${tasks.length})`;
  $("#days").innerHTML = DAYS.map((name, i) => {
    const day = W.add(monday, i), list = tasks.filter((t) => t.day === day);
    const cls = ["day", i === 5 ? "sat" : i === 6 ? "sun" : "", day === today() ? "today" : ""].join(" ");
    return `<section class="${cls}" id="d-${day}" data-day="${day}">
      <h3><span>${name}</span><span class="pill">${md(day)}</span>${dayRate(list)}</h3>
      <div class="rows">${list.map(rowHtml).join("")}</div>
      <button class="add" data-act="add">+ 새로 만들기</button></section>`;
  }).join("");
  document.querySelectorAll(".row textarea").forEach(grow);
  renderDue();
}
function renderDue() {
  $("#mustbox").classList.toggle("hidden", !musts.length);
  $("#mustCount").textContent = `(${musts.length})`;
  $("#mustList").innerHTML = musts.map((t) => `<div class="dl-item" data-day="${t.day}"><span>${esc(t.title) || "(제목 없음)"}</span><span class="mk must ${t.day < today() ? "late" : ""}">${t.day === today() ? "오늘" : md(t.day) + " 못 끝냄"}</span></div>`).join("");
  $("#dueCount").textContent = dues.length ? `(${dues.length})` : "";
  $("#dueList").innerHTML = dues.length
    ? dues.map((t) => { const d = W.due(t.deadline); return `<div class="dl-item" data-id="${t.id}" data-day="${t.day}"><span>${esc(t.title) || "(제목 없음)"}</span><span class="chip ${d.cls}">${fmtDl(t.deadline)} · ${d.text}</span></div>`; }).join("")
    : `<div style="color:var(--sub);font-size:14px">7일 안에 마감인 할 일이 없어요</div>`;
  document.querySelectorAll(".row").forEach((r) => {
    const t = tasks.find((x) => x.id == r.dataset.id); if (t) r.querySelector(".chip").outerHTML = chip(t);
  });
}
function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

// ── 저장 ──
async function save(id, patch) {
  const { data, error } = await sb.from("tasks").update(patch).eq("id", id).select().single();
  if (fail(error)) return;
  Object.assign(tasks.find((t) => t.id === id) ?? {}, data);
  Object.assign(calTasks.find((t) => t.id === id) ?? {}, data);
  if (cal) renderCal();
  musts = musts.filter((t) => t.id !== id);
  if (data.must_do && !data.done && data.day <= today()) { musts.push(data); musts.sort((a, b) => a.day.localeCompare(b.day)); }
  const di = dues.findIndex((t) => t.id === id);
  const inDue = !data.done && data.deadline && new Date(data.deadline) <= Date.now() + 7 * 86400000;
  if (di >= 0 && !inDue) dues.splice(di, 1);
  else if (inDue) { di >= 0 ? (dues[di] = data) : dues.push(data); dues.sort((a, b) => new Date(a.deadline) - new Date(b.deadline)); }
  return data;
}
const taskOf = (el) => tasks.find((t) => t.id == el.closest(".row").dataset.id);

$("#days").addEventListener("click", async (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "add") {
    const day = e.target.closest(".day").dataset.day;
    const { data, error } = await sb.from("tasks").insert({ day }).select().single();
    if (fail(error)) return;
    tasks.push(data);
    e.target.closest(".day").querySelector(".rows").insertAdjacentHTML("beforeend", rowHtml(data));
    e.target.closest(".day").querySelector(".row:last-child textarea").focus();
  }
  if (act === "open" || act === "dl") openSheet(taskOf(e.target), act === "dl");
  if (act === "timer") toggleTimer(taskOf(e.target));
});
$("#days").addEventListener("change", async (e) => {
  if (e.target.type !== "checkbox") return;
  const t = taskOf(e.target);
  if (await save(t.id, { done: e.target.checked })) { renderWeek(); bumpStats(); }
});
$("#days").addEventListener("input", (e) => e.target.tagName === "TEXTAREA" && grow(e.target));
$("#days").addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.key === "Enter" && !e.isComposing) { e.preventDefault(); e.target.blur(); }
});
$("#days").addEventListener("focusout", async (e) => {
  if (e.target.tagName !== "TEXTAREA") return;
  const t = taskOf(e.target), title = e.target.value.trim();
  if (!title && !t.deadline && !t.note) { // 빈 줄은 남기지 않음
    await sb.from("tasks").delete().eq("id", t.id);
    tasks = tasks.filter((x) => x !== t); e.target.closest(".row").remove();
  } else if (title !== t.title) await save(t.id, { title });
  if (dirty) { dirty = false; softReload(); }
});
async function bumpStats() { // 주 목록 % 만 다시
  const weeks = W.weeksOf(year);
  const { data } = await sb.rpc("week_stats", { from_day: weeks[0], to_day: W.add(weeks.at(-1), 6) });
  if (data) renderWeeks(Object.fromEntries(data.map((x) => [x.start, x])));
}
$("#mustList").onclick = $("#dueList").onclick = (e) => {
  const it = e.target.closest(".dl-item"); if (!it) return;
  const m = W.monday(it.dataset.day);
  const go = () => document.getElementById("d-" + it.dataset.day)?.scrollIntoView({ behavior: "smooth" });
  if (m === monday) return go();
  monday = m; year = W.isoWeek(m).year; loadAll().then(go);
};

// ── 끌어서 날짜 옮기기 (마우스·터치 공통 pointer 이벤트) ──
// 주간: 줄 왼쪽 ⠿ 손잡이를 잡고 다른 요일/같은 날 다른 위치로. 월간: 알약을 끌어 다른 날짜 칸으로(폰은 꾹 누른 뒤).
let drag = null, dragSuppressClick = false;
function dragStart(e, t, src) {
  document.activeElement?.blur();
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost"; ghost.textContent = t.title || "(제목 없음)";
  document.body.append(ghost);
  src.classList.add("dragging");
  drag = { t, src, ghost, x: e.clientX, y: e.clientY, target: null, line: null };
  dragMove(e); requestAnimationFrame(autoScroll);
  navigator.vibrate?.(15);
}
function dragMove(e) {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.ghost.style.left = drag.x + 12 + "px"; drag.ghost.style.top = drag.y + 8 + "px";
  document.querySelectorAll(".drop").forEach((el) => el.classList.remove("drop"));
  drag.line?.remove(); drag.line = null;
  const under = document.elementFromPoint(drag.x, drag.y);
  const day = under?.closest(".day"), cell = under?.closest(".dc");
  drag.target = day || cell || null;
  if (!drag.target) return;
  drag.target.classList.add("drop");
  if (day) { // 같은 날 안의 위치 표시선
    const rows = [...day.querySelectorAll(".row")].filter((r) => r !== drag.src);
    const before = rows.find((r) => { const b = r.getBoundingClientRect(); return drag.y < b.top + b.height / 2; });
    drag.line = Object.assign(document.createElement("div"), { className: "drop-line" });
    before ? before.before(drag.line) : day.querySelector(".rows").append(drag.line);
    drag.before = before ? +before.dataset.id : null;
  }
}
function autoScroll() {
  if (!drag) return;
  const edge = 70, top = 110;
  if (drag.y < top + edge) window.scrollBy(0, -12); else if (drag.y > innerHeight - edge) window.scrollBy(0, 12);
  requestAnimationFrame(autoScroll);
}
async function dragEnd() {
  if (!drag) return;
  const { t, src, ghost, target, before } = drag;
  ghost.remove(); drag.line?.remove(); src.classList.remove("dragging");
  document.querySelectorAll(".drop").forEach((el) => el.classList.remove("drop"));
  drag = null; dragSuppressClick = true; setTimeout(() => (dragSuppressClick = false), 50);
  if (!target) return;
  const day = target.dataset.day, patch = {};
  if (day !== t.day) patch.day = day;
  if (target.classList.contains("day")) { // 순서: 앞뒤 줄 sort 의 중간값
    const list = tasks.filter((x) => x.day === day && x.id !== t.id);
    const i = before == null ? list.length : list.findIndex((x) => x.id === before);
    const prev = list[i - 1], next = list[i];
    const sort = prev && next ? (prev.sort + next.sort) / 2 : prev ? prev.sort + 1 : next ? next.sort - 1 : t.sort;
    if (sort !== t.sort) patch.sort = sort;
  }
  if (!Object.keys(patch).length) return;
  if (await save(t.id, patch)) { await loadAll(); bumpStats(); if (patch.day) toast(`${md(day)}(${KDAY[W.parse(day).getDay()]})로 옮겼어요`); }
}
document.addEventListener("pointermove", dragMove);
document.addEventListener("pointerup", dragEnd);
document.addEventListener("pointercancel", dragEnd);
document.addEventListener("touchmove", (e) => drag && e.preventDefault(), { passive: false }); // 끄는 동안 화면 스크롤 막기
document.addEventListener("click", (e) => { if (dragSuppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
// 주간: 손잡이 잡으면 바로 시작
$("#days").addEventListener("pointerdown", (e) => {
  const g = e.target.closest(".grip"); if (!g) return;
  e.preventDefault(); g.releasePointerCapture?.(e.pointerId);
  dragStart(e, taskOf(g), g.closest(".row"));
});
// 월간: 마우스는 5px 움직이면, 터치는 0.35초 꾹 누르면 시작
function pillDown(e) {
  const pill = e.target.closest(".pill"); if (!pill) return;
  const t = calTasks.find((x) => x.id == pill.dataset.id); if (!t) return;
  const x0 = e.clientX, y0 = e.clientY;
  let timer = e.pointerType === "mouse" ? null : setTimeout(() => { cleanup(); dragStart(e, t, pill); }, 350);
  const mv = (ev) => {
    const d = Math.hypot(ev.clientX - x0, ev.clientY - y0);
    if (e.pointerType === "mouse" && d > 5) { cleanup(); dragStart(ev, t, pill); }
    else if (timer && d > 8) cleanup(); // 터치로 스크롤하는 중
  };
  const cleanup = () => { clearTimeout(timer); timer = null; removeEventListener("pointermove", mv); removeEventListener("pointerup", cleanup); removeEventListener("pointercancel", cleanup); };
  addEventListener("pointermove", mv); addEventListener("pointerup", cleanup); addEventListener("pointercancel", cleanup);
}
$("#monthView").addEventListener("pointerdown", pillDown);
$("#weekCal").addEventListener("pointerdown", pillDown);
$("#monthView").addEventListener("contextmenu", (e) => e.target.closest(".pill") && e.preventDefault());
$("#weekCal").addEventListener("contextmenu", (e) => e.target.closest(".pill") && e.preventDefault());

// ── 상세 시트: 데드라인 설정·재설정·알람 ──
function openSheet(t, focusDl) {
  openId = t.id;
  $("#sTitle").value = t.title; $("#sDone").checked = t.done; $("#sDay").value = t.day;
  $("#sDl").value = toLocalInput(t.deadline ?? new Date()); // 없으면 연 시점부터 고르게
  $("#sDlLabel").textContent = t.deadline ? "데드라인 재설정" : "데드라인 (아직 없음 — 시간을 고르면 설정돼요)";
  $("#sRemind").value = t.remind_min ?? "";
  $("#sNote").value = t.note;
  $("#sEst").value = t.estimate_min ?? "";
  document.querySelectorAll("#sMarks button").forEach((b) => b.classList.toggle("on", !!t[b.dataset.mk]));
  $("#sSpent").textContent = hms(elapsed(t), true);
  $("#sTimer").textContent = t.started_at ? "⏸ 정지" : "▶ 시작";
  $("#sSpentEdit").value = "";
  $("#sLog").innerHTML = (t.deadline_log || []).slice().reverse().map((l) =>
    `<li>${fmtDl(l.from)} → ${l.to ? fmtDl(l.to) : "없음"} <span style="opacity:.7">(${fmtDl(l.at)} 변경)</span></li>`).join("");
  $("#sheet").showModal();
  if (focusDl) $("#sDl").focus();
}
const cur = () => tasks.find((t) => t.id === openId) ?? calTasks.find((t) => t.id === openId) ?? dues.find((t) => t.id === openId);
async function sheetSave(patch) {
  const d = await save(openId, patch);
  if (d) { openSheet(d); renderWeek(); }
}
$("#sTitle").onchange = () => sheetSave({ title: $("#sTitle").value.trim() });
$("#sDone").onchange = () => sheetSave({ done: $("#sDone").checked }).then(bumpStats);
$("#sNote").onchange = () => sheetSave({ note: $("#sNote").value });
$("#sEst").onchange = () => sheetSave({ estimate_min: +$("#sEst").value > 0 ? Math.round(+$("#sEst").value) : null });
$("#sEstQ").onclick = (e) => { if (e.target.dataset.m === undefined) return; $("#sEst").value = e.target.dataset.m; $("#sEst").onchange(); };
$("#sTimer").onclick = () => toggleTimer(cur());
$("#sMarks").onclick = (e) => { const k = e.target.dataset.mk; if (k) sheetSave({ [k]: !cur()[k] }); };
$("#sSpentEdit").onchange = () => { // 타이머 깜빡했을 때 직접 고치기 (도는 중이면 멈춤)
  const m = +$("#sSpentEdit").value; if (!(m >= 0)) return;
  sheetSave({ spent_sec: Math.round(m * 60), started_at: null });
};
$("#sRemind").onchange = () => sheetSave({ remind_min: $("#sRemind").value === "" ? null : +$("#sRemind").value });
$("#sDl").onchange = () => sheetSave({ deadline: $("#sDl").value ? new Date($("#sDl").value).toISOString() : null });
$("#sDay").onchange = async () => {
  if (!$("#sDay").value) return;
  const d = await save(openId, { day: $("#sDay").value });
  if (d) { $("#sheet").close(); loadAll(); bumpStats(); toast(`${md(d.day)}로 옮겼어요`); }
};
$("#sQuick").onclick = (e) => {
  const q = e.target.dataset.q; if (!q) return;
  const t = cur(), at = (day, h) => { const d = W.parse(day); d.setHours(h, 0, 0, 0); return d; };
  const base = t.deadline ? new Date(t.deadline) : at(t.day, 18);
  const v = q === "today18" ? at(today(), 18) : q === "tom9" ? at(W.add(today(), 1), 9) : q === "tom18" ? at(W.add(today(), 1), 18)
    : q === "+1d" ? new Date(base.getTime() + 86400000) : q === "+1w" ? new Date(base.getTime() + 7 * 86400000) : null;
  sheetSave({ deadline: v ? v.toISOString() : null });
};
$("#sDel").onclick = async () => {
  if (!confirm("이 할 일을 삭제할까요?")) return;
  const { error } = await sb.from("tasks").delete().eq("id", openId);
  if (fail(error)) return;
  tasks = tasks.filter((t) => t.id !== openId); dues = dues.filter((t) => t.id !== openId); calTasks = calTasks.filter((t) => t.id !== openId);
  $("#sheet").close(); renderWeek(); renderCal(); bumpStats();
};
$("#sClose").onclick = () => $("#sheet").close();
$("#sheet").addEventListener("close", async () => {
  const t = cur(); openId = null;
  if (t && !$("#sTitle").value.trim() && !t.deadline && !$("#sNote").value.trim()) { // 월간에서 만들고 제목 없이 닫으면 지움
    await sb.from("tasks").delete().eq("id", t.id);
    tasks = tasks.filter((x) => x !== t); calTasks = calTasks.filter((x) => x !== t);
  }
  renderWeek(); renderCal();
  if (dirty) { dirty = false; softReload(); }
});


// ── 주 이동 ──
$("#prevW").onclick = () => { monday = W.add(monday, -7); year = W.isoWeek(monday).year; loadAll(); };
$("#nextW").onclick = () => { monday = W.add(monday, 7); year = W.isoWeek(monday).year; loadAll(); };
$("#todayBtn").onclick = () => {
  if (view === "month") { const t = W.parse(today()); cal = { ...cal, y: t.getFullYear(), m: t.getMonth() + 1 }; return loadCal(); }
  monday = W.monday(today()); year = W.isoWeek(today()).year; loadAll(true); };
$("#weeksBtn").onclick = () => { $("#weeks").classList.toggle("hidden-m"); $("#weeks .on")?.scrollIntoView({ block: "center" }); };
const hideM = document.createElement("style"); hideM.textContent = "@media (max-width:860px){.hidden-m{display:none}}"; document.head.append(hideM);

// ── 푸시 알람 ──
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
async function vapidPublic() { const { data, error } = await sb.rpc("vapid_public"); if (error || !data) throw new Error("알람 서버 준비 중이에요. 1분 뒤 다시 눌러 주세요"); return data; }
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
async function pushButton() {
  const btn = $("#pushBtn");
  if (!("serviceWorker" in navigator)) return btn.classList.add("hidden");
  const reg = await navigator.serviceWorker.ready;
  const sub = "PushManager" in window && (await reg.pushManager.getSubscription());
  btn.textContent = sub && Notification.permission === "granted" ? "🔔 알람 켜짐" : "🔔 알람 켜기";
  if (sub) await sb.from("push_subs").upsert({ endpoint: sub.endpoint, user_id: me.id, sub: sub.toJSON() }); // 계정 바뀌었을 때 대비
}
$("#pushBtn").onclick = async () => {
  if (isIOS && !standalone) return alert("아이폰은 홈 화면에 추가해야 알람이 와요.\n\n사파리 아래 [공유] 버튼 → [홈 화면에 추가] → 홈 화면의 '플래너' 아이콘으로 열고 다시 [알람 켜기]를 눌러 주세요.");
  if (!("PushManager" in window)) return alert("이 브라우저는 알람을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return alert("알림이 차단돼 있어요. 브라우저(또는 휴대폰) 설정에서 이 사이트 알림을 허용해 주세요.");
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(await vapidPublic()) }); }
    catch (e) { return alert(e.message); }
  }
  const { error } = await sb.from("push_subs").upsert({ endpoint: sub.endpoint, user_id: me.id, sub: sub.toJSON() });
  if (fail(error)) return;
  await reg.showNotification("🔔 알람이 켜졌어요", { body: "데드라인 알람이 이 기기로 와요", icon: "icon-192.png" });
  pushButton();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
sb.auth.onAuthStateChange((ev) => ev === "SIGNED_OUT" && location.reload());
boot();
</script>

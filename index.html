<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔로 플래너</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191919">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root {
  --bg: #191919; --panel: #202020; --line: #2f2f2f; --hover: #2a2a2a; --text: #e6e6e6; --sub: #9b9b9b;
  --blue: #2383e2; --red: #eb5757; --orange: #e9a23b; --green: #4dab9a; --accent: #8b6fd6;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #ffffff; --panel: #f7f7f5; --line: #e9e9e7; --hover: #efefed; --text: #37352f; --sub: #787774; --accent: #493087; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
.hidden { display: none !important; }

/* 로그인 */
#auth { max-width: 360px; margin: 12vh auto; padding: 0 16px; }
#auth h1 { font-size: 26px; margin: 0 0 4px; }
#auth p { color: var(--sub); margin: 0 0 24px; }
#auth input { width: 100%; padding: 12px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.btn { padding: 10px 14px; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 600; }
.btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
#auth .btn { width: 100%; margin-top: 4px; }
#auth .msg { color: var(--red); min-height: 22px; font-size: 14px; }

/* 상단 */
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--line); }
header .logo { font-weight: 700; margin-right: auto; }
header .btn { padding: 6px 10px; font-size: 14px; white-space: nowrap; }
#me { color: var(--sub); font-size: 13px; }

.layout { display: grid; grid-template-columns: 260px 1fr; max-width: 1200px; margin: 0 auto; }
aside { border-right: 1px solid var(--line); padding: 16px 12px; height: calc(100vh - 106px); position: sticky; top: 106px; overflow: auto; }
aside .yr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
aside .yr button { padding: 2px 8px; color: var(--sub); }
.wk { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; }
.wk:hover { background: var(--hover); }
.wk.on { background: var(--hover); box-shadow: inset 3px 0 var(--accent); }
.wk b { font-weight: 600; } .wk small { color: var(--sub); margin-left: 6px; }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

main { padding: 20px 24px 120px; min-width: 0; }
.weekhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.weekhead h1 { font-size: 28px; margin: 0; }
.weekhead .nav { font-size: 20px; color: var(--sub); padding: 0 6px; }
.weekhead .range { color: var(--sub); font-size: 14px; }
.rate { display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 14px; margin: 6px 0 18px; }
.rate .bar { flex: 1; max-width: 240px; margin: 0; height: 6px; }

/* 표시: 🔥 꼭 / ⭐ 중요 / 우선순위 */
.mk { font-size: 12px; padding: 1px 7px; border-radius: 99px; white-space: nowrap; cursor: pointer; border: 1px solid var(--line); color: var(--sub); }
.mk.must { color: #fff; background: #ff4d4f; border-color: #ff4d4f; }
.mk.must.late { background: #8f1d21; border-color: #ff6b6b; }
.mk.imp { color: #fff; background: #ff8c1a; border-color: #ff8c1a; }
.row.done .mk { opacity: .45; }
/* 중요·오늘 꼭 → 밝은 빨간색 */
.row.hot:not(.done) { box-shadow: inset 3px 0 #ff4d4f; background: color-mix(in srgb, #ff4d4f 9%, transparent); }
.row.hot:not(.done) textarea { color: #ff4d4f; font-weight: 700; }
/* ★ 중요(🔥 없을 때) → 주황 */
.row.imp:not(.done) { box-shadow: inset 3px 0 #ff8c1a; background: color-mix(in srgb, #ff8c1a 10%, transparent); }
.row.imp:not(.done) textarea { color: #ff8c1a; font-weight: 700; }
.quick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.mgrid .pill.hot { background: color-mix(in srgb, #ff4d4f 30%, transparent); color: #ff6b6b; font-weight: 700; }
.mgrid .pill.imp { background: color-mix(in srgb, #ff8c1a 30%, transparent); color: #ffa24d; font-weight: 700; }
/* 📌 고정업무 */
#routinebox { border: 1px solid color-mix(in srgb, var(--green) 55%, var(--line)); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--panel); }
#routinebox summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
#routinebox summary #rtCount { color: var(--sub); font-weight: 400; font-size: 14px; margin-right: auto; }
.adminonly { display: none; } body.is-admin .adminonly { display: inline-block; }
#rtEdit { padding: 3px 10px; font-size: 13px; }
.rtbar { height: 6px; margin: 8px 0 4px; } .rtbar i { background: var(--green); }
.rt { display: flex; gap: 10px; align-items: flex-start; padding: 6px 6px; border-bottom: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.rt input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--green); flex: none; }
.rt.done span { color: var(--sub); text-decoration: line-through; }
.rt.done input { display: none; } /* 끝낸 건 체크박스 자리에 이름 도장 */
.rt .who { flex: none; font-size: 12.5px; padding: 1px 9px; border-radius: 99px; background: var(--green); color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rt.red { background: color-mix(in srgb, #ff4d4f 13%, transparent); } .rt.green { background: color-mix(in srgb, var(--green) 13%, transparent); }
.rt.yellow { background: color-mix(in srgb, #e9c23b 18%, transparent); font-weight: 600; }
.rtdone { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--green) 22%, transparent); font-weight: 600; }
#rtStatus table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
#rtStatus td { padding: 5px 4px; border-bottom: 1px solid var(--line); } #rtStatus td.n { white-space: nowrap; color: var(--sub); }
#rtStatus .bar { margin: 0; width: 120px; height: 6px; }
dialog.wide { width: min(860px, calc(100vw - 24px)); }
.rthead small { color: var(--sub); margin-left: 6px; }
.rtrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto auto 26px; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rtrow input[type=text] { width: 100%; padding: 6px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.rtrow select { padding: 5px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.dows { display: flex; gap: 2px; } .dows button { width: 24px; height: 26px; border-radius: 5px; font-size: 12px; background: var(--hover); border: 1px solid var(--line); color: var(--sub); }
.dows button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.rtrow .mv { display: flex; flex-direction: column; } .rtrow .mv button { font-size: 10px; line-height: 12px; color: var(--sub); }
@media (max-width: 860px) { .rtrow { grid-template-columns: 22px minmax(0, 1fr) 26px; } .rtrow .t { grid-column: 2 / 4; } .rtrow .dows, .rtrow select { grid-column: 2 / 4; } }
/* 👥 팀 */
#teamView { max-width: 960px; margin: 0 auto; padding: 16px 20px 100px; }
#teamView h2 { margin: 6px 0 12px; } #teamView h3 { margin: 22px 0 8px; font-size: 16px; }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
.tcard b { margin-right: 8px; } .chipname { display: inline-block; padding: 2px 9px; margin: 3px 4px 0 0; border-radius: 99px; background: var(--hover); font-size: 13px; }
.tform { display: grid; grid-template-columns: 150px minmax(0, 1fr) 140px 100px auto; gap: 6px; }
.tform select, .tform input, .tmem select { padding: 7px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); width: 100%; }
.titem { display: flex; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.titem input { width: 18px; height: 18px; accent-color: var(--green); } .titem .t { flex: 1; min-width: 0; } .titem.done .t { color: var(--sub); text-decoration: line-through; }
.titem .who { font-size: 12px; color: var(--green); white-space: nowrap; } .titem button { color: var(--sub); font-size: 12px; }
.tmem { display: grid; grid-template-columns: 1fr 160px auto; gap: 6px; align-items: center; padding: 4px 0; }
.tmem [data-temppw] { font-size: 12.5px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); white-space: nowrap; }
.mk.team { color: #fff; background: #0f9d76; border-color: #0f9d76; }
.row.teamrow textarea, .row.teamrow .ttl { color: var(--text); } .row.teamrow.done .ttl { color: var(--sub); text-decoration: line-through; }
.row .ttl { line-height: 1.5; padding-top: 1px; }
@media (max-width: 860px) { .tform { grid-template-columns: 1fr 1fr; } .tform .ti { grid-column: 1 / 3; } }
/* 📨 업무 배정 */
#assignbox { display: none; border: 1px solid color-mix(in srgb, #2383e2 50%, var(--line)); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--panel); }
body.is-admin #assignbox { display: block; }
#assignbox summary { cursor: pointer; font-weight: 600; } #assignbox summary small { color: var(--sub); font-weight: 400; }
#asgText { width: 100%; margin-top: 8px; padding: 9px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); resize: vertical; }
.asgbar { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; } .asgbar small { color: var(--sub); }
.acard { display: grid; grid-template-columns: 120px minmax(0, 1fr) 140px 100px 30px 28px; gap: 6px; margin-top: 8px; align-items: center; }
.acard select, .acard input { width: 100%; padding: 6px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.acard select.bad { border-color: var(--red); }
#asgList { margin-top: 12px; font-size: 14px; }
#asgList h4 { margin: 0 0 4px; font-size: 13px; color: var(--sub); }
.aitem { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); }
.aitem .who { font-weight: 600; white-space: nowrap; } .aitem .t { flex: 1; min-width: 0; }
.aitem.ok .t { color: var(--sub); text-decoration: line-through; } .aitem .why { display: block; color: #e9a23b; font-size: 12px; }
.aitem button { color: var(--sub); font-size: 12px; }
.astar { font-size: 18px !important; color: var(--sub); line-height: 1; } .astar.on { color: #ff8c1a !important; }
.mk.asg { color: #fff; background: #2383e2; border-color: #2383e2; }
.asgnote { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, #2383e2 15%, transparent); font-size: 13px; line-height: 1.6; }
@media (max-width: 860px) { .acard { grid-template-columns: 1fr 1fr 30px 28px; } .acard .ti { grid-column: 1 / 5; grid-row: 1; } }
/* 🧠 오늘 브리핑 */
/* 오늘 날짜 옆 🧠 버튼 */
.briefBtn { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; color: #fff; background: linear-gradient(90deg, #6b4fd1, #8b6fd6); letter-spacing: 0; }
.briefBtn.ask { background: #e9a23b; } .briefBtn:disabled { opacity: .6; }
#briefText { margin: 4px 0 10px; margin-top: 10px; padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); white-space: pre-wrap; line-height: 1.65; font-size: 14.5px; }
#briefText .at { display: block; color: var(--sub); font-size: 12px; margin-top: 8px; }
/* 데드라인 모아보기 */
#mustbox, #duebox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 22px; background: var(--panel); }
#mustbox { border-color: #e5484d66; margin-bottom: 10px; }
#mustbox summary, #duebox summary { cursor: pointer; font-weight: 600; }
#mustbox .dl-item, #duebox .dl-item { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; }
#mustbox .dl-item:first-of-type, #duebox .dl-item:first-of-type { border-top: 0; }
#mustbox .dl-item span:first-child, #duebox .dl-item span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 요일 칸 (노션 MON~SUN) */
.day { margin-bottom: 26px; scroll-margin-top: 112px; }
.day h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 20px; letter-spacing: .02em; }
.day h3 .pill { font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--hover); color: var(--text); font-weight: 600; }
.day h3 small { color: var(--sub); font-size: 13px; font-weight: 400; }
.day h3 .dbar { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.day h3 .dbar i { display: block; height: 100%; background: var(--green); }
.day.sat h3 > span:first-child { color: var(--blue); } .day.sun h3 > span:first-child { color: var(--red); }
.day.today h3 .pill { background: var(--accent); color: #fff; }
.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: var(--gw, 18px) 24px minmax(0, 1fr) auto var(--sw, 28px) 28px; align-items: start; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.grip { cursor: grab; color: var(--sub); opacity: .3; font-size: 15px; line-height: 24px; text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.row:hover .grip { opacity: 1; }
.meta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.tm { font-size: 13px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line); color: var(--sub); font-variant-numeric: tabular-nums; }
.tm b { font-weight: 600; color: var(--text); }
.qb { font-size: 13px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line); color: var(--text); font-variant-numeric: tabular-nums; }
.qb.empty { color: var(--sub); }
/* 보기 설정: 끈 기능은 숨김 */
body.off-start [data-act=start], body.off-est [data-act=est], body.off-timer .tm, body.off-dl .row .chip,
body.off-routine #routinebox, body.off-teamrow .teamrow, body.off-brief .briefBtn, body.off-brief #briefText, body.off-must #mustbox, body.off-due #duebox, body.off-wcal #weekCal { display: none !important; }
body.off-drag { --gw: 0px; } body.off-star { --sw: 0px; }
body.off-drag .grip, body.off-star .star { visibility: hidden; overflow: hidden; }
.pop label.tg { display: flex; align-items: center; justify-content: space-between; padding: 7px 2px; font-size: 14px; border-top: 1px solid var(--line); cursor: pointer; }
.pop label.tg:first-of-type { border-top: 0; }
.pop label.tg input { width: 18px; height: 18px; accent-color: var(--accent); }
.pop.dlpop { width: 300px; } .pop.dlpop .grid { grid-template-columns: repeat(3, 1fr); } .pop.dlpop .grid button { font-size: 13px; }
.pop.inline { position: static; width: auto; padding: 0; border: 0; box-shadow: none; background: none; }
.pop { position: fixed; z-index: 40; width: 236px; padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.pop h4 { margin: 0 0 8px; font-size: 13px; color: var(--sub); font-weight: 600; }
.pop .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pop .grid button { padding: 7px 0; border-radius: 8px; background: var(--hover); border: 1px solid var(--line); font-size: 14px; }
.pop .grid button:hover { border-color: var(--accent); }
.pop .grid button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.pop .own { display: flex; gap: 6px; margin-top: 8px; }
.pop .own input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.pop .clear { margin-top: 8px; width: 100%; padding: 6px 0; color: var(--red); font-size: 13px; }
.tm.run { background: var(--green); border-color: var(--green); color: #fff; } .tm.run b { color: #fff; }
.tm.over { background: var(--red); border-color: var(--red); color: #fff; } .tm.over b { color: #fff; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; max-width: 300px; padding: 6px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dragging { opacity: .35; }
.day.drop { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 6px; }
.mgrid .dc.drop { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.drop-line { height: 3px; margin: -2px 0; background: var(--accent); border-radius: 2px; }
.timerline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timerline b { font-size: 20px; font-variant-numeric: tabular-nums; }
.timerline input { width: 130px !important; }
.row:hover { background: var(--hover); }
.row input[type=checkbox] { width: 18px; height: 18px; margin: 3px 0 0 2px; accent-color: var(--blue); cursor: pointer; }
.row textarea { width: 100%; resize: none; border: 0; background: transparent; padding: 0; line-height: 1.5; overflow: hidden; outline: none; min-height: 22px; }
.row.done textarea { color: var(--sub); }
.row .star { font-size: 17px; line-height: 22px; border-radius: 4px; color: var(--sub); opacity: .35; }
.row .star:hover { background: var(--line); opacity: 1; }
.row:hover .star { opacity: .8; }
.row .star.on { opacity: 1; color: #ff8c1a; }
.row .more { color: var(--sub); font-size: 18px; line-height: 22px; border-radius: 4px; }
.row .more:hover { background: var(--line); }
.chip { font-size: 13px; padding: 1px 8px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line); color: var(--sub); }
.chip.ok { color: var(--text); }
.chip.soon { color: #fff; background: var(--orange); border-color: var(--orange); }
.chip.over { color: #fff; background: var(--red); border-color: var(--red); }
.chip.fin { text-decoration: line-through; }
.chip .log { opacity: .85; margin-left: 4px; }
.chip.none, .tm.none, .qb.empty { opacity: .4; border-color: transparent; padding: 1px 4px; }
.row:hover .chip.none, .row:hover .tm.none, .row:hover .qb.empty { opacity: 1; border-color: var(--line); }
.add { color: var(--sub); padding: 6px 8px; width: 100%; text-align: left; border-radius: 6px; }
.add:hover { background: var(--hover); }

/* 월 달력 */
/* 주간 | 월간 전환 탭 */
.seg { position: sticky; top: 53px; z-index: 4; display: flex; justify-content: center; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.seg div { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { padding: 7px 26px; border-radius: 8px; font-weight: 600; color: var(--sub); }
.seg button.on { background: var(--hover); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
/* 월간 보기 (애플 캘린더 모양) */
body.mv .layout, body.tv .layout { display: none; }
body:not(.mv) #monthView { display: none; }
body:not(.tv) #teamView { display: none; }
.mview { max-width: 1400px; margin: 0 auto; padding: 16px 20px 80px; }
.mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mh h1 { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
.mh .navs { display: flex; gap: 8px; }
.mh .navs button { min-width: 36px; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--hover); font-size: 15px; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mgrid .dow { text-align: center; font-size: 16px; color: var(--sub); padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
.mgrid .dc { min-height: max(120px, calc((100vh - 190px) / 6)); border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px 4px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.mgrid .dc:nth-child(7n) { border-right: 0; }
.mgrid .dc:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.mgrid .dc.wkend { background: color-mix(in srgb, var(--panel) 70%, transparent); }
.mgrid .dn { text-align: right; font-size: 20px; font-weight: 600; padding: 0 4px 2px; }
.mgrid .dc.out .dn { color: var(--sub); opacity: .7; }
.mgrid .dn b { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #ff3b30; color: #fff; }
.mgrid .pill { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; display: block; width: 100%; text-align: left; font-size: 13px; line-height: 1.35; padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: color-mix(in srgb, #8b6fd6 38%, transparent); color: color-mix(in srgb, #c9b8ff 80%, var(--text)); }
.mgrid .pill.dl { background: color-mix(in srgb, #ff453a 32%, transparent); color: #ff8a80; }
.mgrid .pill.dl.soon { background: color-mix(in srgb, #ff9f0a 32%, transparent); color: #ffc46b; }
.mgrid .pill.x { background: color-mix(in srgb, var(--sub) 18%, transparent); color: var(--sub); text-decoration: line-through; }
.mgrid .more { font-size: 12px; color: var(--sub); padding-left: 6px; white-space: nowrap; }
@media (prefers-color-scheme: light) {
  .mgrid .pill { color: #4b2fa8; } .mgrid .pill.dl { color: #c4281c; } .mgrid .pill.dl.soon { color: #a35a00; }
}
/* 주간 화면 SUN 밑 달력: 같은 월 달력을 조금 작게 */
.mview.wcal { display: block; padding: 8px 0 0; margin-top: 10px; border-top: 1px solid var(--line); }
.wcal .mh h1 { font-size: 26px; }
.wcal .mgrid .dc { min-height: 110px; }
.wcal .mgrid .dn { font-size: 16px; }
.wcal .mgrid .dn b { width: 28px; height: 28px; }

/* 상세 시트 */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); width: min(480px, calc(100vw - 24px)); padding: 18px; }
.nteam { margin: 10px 0 0; } .nteam b { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
.nbtn { padding: 8px 16px; margin: 0 6px 6px 0; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; }
.nbtn:hover:not(:disabled) { border-color: var(--accent); } .nbtn:disabled { opacity: .4; cursor: default; }
.chipname [data-rmname] { margin-left: 4px; color: var(--sub); } .chipname small { color: var(--sub); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 4px; }
dialog input:not([type=checkbox]), dialog select, dialog textarea { width: 100%; padding: 9px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
dialog .ttl { font-size: 17px; font-weight: 600; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.quick button { font-size: 13px; padding: 4px 9px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); }
.loglist { font-size: 13px; color: var(--sub); margin: 6px 0 0; padding-left: 18px; }
.sheet-foot { display: flex; justify-content: space-between; margin-top: 18px; }
.danger { color: var(--red); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }

/* 폰 */
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: fixed; inset: 106px 0 0 0; height: auto; z-index: 6; background: var(--bg); border: 0; }
  main { padding: 14px 16px 120px; }
  .weekhead h1 { font-size: 24px; }
  .row { grid-template-columns: var(--gw, 18px) 24px minmax(0, 1fr) var(--sw, 28px) 28px; }
  .row .meta { grid-column: 3; grid-row: 2; justify-content: flex-start; }
  .row .star { grid-column: 4; grid-row: 1; opacity: .55; }
  .row .more { grid-column: 5; grid-row: 1; }
  .grip { opacity: .6; font-size: 17px; }
  .chip.none, .tm.none, .qb.empty { opacity: .6; }
  .meta { gap: 8px; }
  .meta .qb, .meta .tm, .meta .chip { min-height: 30px; min-width: 34px; padding: 3px 8px; }
  #me { display: none; }
  .mview { padding: 10px 8px 80px; }
  .mview .mh h1 { font-size: 24px; }
  .mgrid .dc { min-height: 92px; padding: 3px 2px; }
  .mgrid .dn { font-size: 13px; }
  .mgrid .dn b { width: 24px; height: 24px; }
  .mgrid .il { display: none; }
  .wcal .mgrid .dc { min-height: 76px; }
  .wcal .mh h1 { font-size: 22px; }
  .mgrid .pill { font-size: 10.5px; padding: 1px 3px; }
  .mgrid .dow { font-size: 13px; }
  header { gap: 6px; }
  header .logo { font-size: 0; }
  header .btn { padding: 6px 9px; font-size: 13px; }
}
@media (min-width: 861px) { #weeksBtn { display: none; } }
</style>

        <div id="asgCards"></div>

</div>

<dialog id="pwDlg"><h3 style="margin:0 0 4px">🔑 새 비밀번호</h3><p id="pwNote" style="color:var(--sub);font-size:13px;margin:0">6자 이상으로 정해 주세요</p>
  <form id="pwForm"><input id="pw1" type="password" minlength="6" autocomplete="new-password" placeholder="새 비밀번호" required style="margin-top:10px">
  <input id="pw2" type="password" minlength="6" autocomplete="new-password" placeholder="한 번 더" required style="margin-top:8px"><div class="msg" id="pwMsg" style="color:var(--red);font-size:13px;min-height:18px;margin-top:6px"></div>
  <button class="btn" type="submit" style="width:100%">바꾸기</button><button class="btn ghost" type="button" id="pwCancel" style="width:100%;margin-top:6px">닫기</button></form></dialog>
<dialog id="nameDlg"><h3 style="margin:0 0 4px">👋 내 이름을 골라 주세요</h3>
  <p style="color:var(--sub);font-size:13px;margin:0 0 6px">고르면 지점 팀도 자동으로 정해져요. 명단에 없으면 대표님께 말씀해 주세요.</p>
  <div id="nameList"></div><button class="btn ghost" id="nameOut" style="margin-top:12px;width:100%">다른 계정으로 로그인</button></dialog>
<dialog id="sheet">

  <div class="quick" id="sQuick">
    <button data-q="today18">오늘 18:00</button>

<dialog id="rtDialog" class="wide">

</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="week.js"></script>
<script src="pick.js"></script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAYS = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
const KDAY = ["일", "월", "화", "수", "목", "금", "토"];
const today = () => W.ymd(new Date());

let me = null, monday = W.monday(today()), year = W.isoWeek(today()).year;
let tasks = [], dues = [], musts = [], openId = null, dirty = false;
let teamTasks = [], routine = [], routineChecks = new Map();
let cal = null, calTasks = []; // 달력에 보이는 달 { y, m }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2600); }
function fail(error) { if (error) { console.error(error); toast("저장 실패: " + (error.message || error)); return true; } }
const md = (s) => { const d = W.parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

// ── 이름·역할 (대표만 업무 배정) ──
let myRole = "manager", myPhone = "", myName = "", kakaoMe = false, kakaoSender = null, isBoss = false, previewTeam = null; // previewTeam: 대표가 '매니저 화면으로 보기' 켠 팀
const inTeam = (list) => previewTeam ? list.filter((x) => x.team_id === previewTeam) : list; // 미리보기: 그 팀 것만
const KAKAO = false; // 카톡 알림톡(솔라피) 켜면 true → 번호 칸·팀 탭 📱 표시 (10-21: 폰 푸시로 운영 결정)
async function loadProfile() {
  let { data } = await sb.from("profiles").select("name, role, phone, temp_pw").eq("user_id", me.id).maybeSingle();
  if (!data) { await pickName(); ({ data } = await sb.from("profiles").select("name, role, phone, temp_pw").eq("user_id", me.id).single()); }
  if (data.temp_pw) openPwDlg(true);
  isBoss = data.role === "admin";
  try { previewTeam = isBoss ? +localStorage.getItem("planner-preview") || null : null; } catch {}
  myRole = previewTeam ? "manager" : data.role; myPhone = data.phone ?? ""; myName = data.name; $("#me").textContent = `${data.name} · ${me.email}`;
  document.body.classList.toggle("is-admin", myRole === "admin");
  if (myRole === "admin") loadAssigned();
  if (isBoss) teams = (await sb.from("teams").select("*").order("sort")).data ?? [];
  if (isBoss) { const k = (await sb.rpc("kakao_status")).data?.[0]; kakaoMe = !!k?.me; kakaoSender = k?.sender ? (k.receiver || "연결됨") : null; } // 💬 카톡 연결 상태
  $("#previewBar").classList.toggle("hidden", !previewTeam);
  if (previewTeam) $("#previewBar").textContent = `👀 ${teams.find((x) => x.id === previewTeam)?.name ?? ""} 매니저 화면 미리보기 · 끄기`;
}
$("#previewBar").onclick = () => { try { localStorage.removeItem("planner-preview"); } catch {} location.reload(); };
// 처음 가입: 명단에서 내 이름 고르기 → 지점 팀까지 자동 (직접 입력 없음)
function pickName() {
  return new Promise((done) => {
    const dlg = $("#nameDlg");
    const draw = async () => {
      const { data, error } = await sb.rpc("roster_names");
      if (fail(error)) return;
      const by = {}; for (const r of data) (by[r.team ?? "지점 없음"] ??= []).push(r);
      $("#nameList").innerHTML = Object.entries(by).map(([tm, rs]) => `<div class="nteam"><b>${esc(tm)}</b>${rs.map((r) =>
        `<button class="nbtn" data-name="${esc(r.name)}" ${r.taken ? "disabled title=\"이미 가입했어요\"" : ""}>${esc(r.name)}${r.taken ? " ✓" : ""}</button>`).join("")}</div>`).join("")
        || `<div style="color:var(--sub)">명단이 비어 있어요 — 대표님께 말씀해 주세요</div>`;
    };
    $("#nameList").onclick = async (e) => {
      const b = e.target.closest("[data-name]"); if (!b) return;
      if (!confirm(`'${b.dataset.name}' 님으로 가입할까요?\n(나중에 바꾸려면 대표님께 말씀해야 해요)`)) return;
      const { error } = await sb.rpc("claim_name", { p_name: b.dataset.name });
      if (fail(error)) return draw();
      dlg.close(); done();
    };
    $("#nameOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    dlg.oncancel = (e) => e.preventDefault(); // Esc 로 못 닫게
    draw(); dlg.showModal();
  });
}
const assignedToMe = (t) => t.assigned_by && t.assigned_by !== me.id;

// ── 로그인 ──
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  me = session?.user ?? null;
  $("#auth").classList.toggle("hidden", !!me);
  $("#app").classList.toggle("hidden", !me);
  if (!me) return;
  $("#me").textContent = me.email;
  applyPrefs();
  await loadProfile();
  await loadAll(true);
  if (view === "team") loadTeam(); // 팀 탭에서 새로고침했을 때
  const kk = new URLSearchParams(location.search).get("kakao"); // 💬 카카오 연결하고 돌아옴
  if (kk) {
    history.replaceState(null, "", location.pathname);
    toast({ ok: "💬 카카오톡 연결 완료! '나와의 채팅'에 확인 메시지를 보냈어요", nomsg: "💬 연결은 됐는데 확인 메시지를 못 보냈어요. 카카오 앱 설정을 확인해 주세요",
      sender_ok: "📮 업무폰 계정 연결 완료! 이제 그 대화방으로 알림이 와요", nofriend: "📮 업무폰 카톡과 대표님 카톡이 친구인지, 대표님이 '카톡으로도 받기'를 먼저 연결했는지 확인해 주세요",
      noscope_sender: "📮 '친구목록'과 '카카오톡 메시지 전송' 둘 다 동의해야 해요. 다시 연결해 주세요",
      sameaccount: "📮 대표님 계정으로 로그인됐어요. 카카오 로그인 화면에서 업무폰 카카오 계정으로 로그인해 주세요",
      cancel: "카카오 연결을 취소했어요", noscope: "💬 '카카오톡 메시지 전송'에 체크해야 해요. ⚙️ → 연결하기를 다시 누르고 체크해 주세요", expired: "시간이 지나서 다시 눌러 주세요" }[kk] ?? "카카오 연결에 실패했어요. 다시 시도해 주세요");
  }
  listen();
  pushButton();
  loadBrief();
}
$("#authForm").onsubmit = async (e) => {
  e.preventDefault();

  const email = $("#email").value.trim(), password = $("#pw").value;
  if (!email || password.length < 6) return ($("#authMsg").textContent = "이메일과 6자 이상 비밀번호를 넣어 주세요");
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) return ($("#authMsg").textContent = error.message.includes("registered") ? "이미 가입된 이메일이에요. 로그인해 주세요" : error.message);

};

async function loadAll(scrollToday) {
  const sun = W.add(monday, 6);
  const weeks = W.weeksOf(year);
  const [t, d, s, m, tt] = await Promise.all([
    sb.from("tasks").select("*").eq("user_id", me.id).gte("day", monday).lte("day", sun).order("sort").order("id"),
    sb.from("tasks").select("id, day, title, deadline, deadline_log").eq("user_id", me.id).eq("done", false).not("deadline", "is", null)
      .lte("deadline", new Date(Date.now() + 7 * 86400000).toISOString()).order("deadline").limit(30),
    sb.rpc("week_stats", { from_day: weeks[0], to_day: W.add(weeks.at(-1), 6) }),
    sb.from("tasks").select("id, day, title").eq("user_id", me.id).eq("must_do", true).eq("done", false).lte("day", today()).order("day").limit(30),
    myRole === "admin" ? { data: [] } : sb.rpc("team_tasks_between", { p_from: monday, p_to: sun }),
  ]);
  if (fail(t.error || d.error || s.error || m.error || tt.error)) return;
  tasks = t.data; dues = d.data; musts = m.data; teamTasks = inTeam(tt.data);
  loadRoutine();
  renderWeeks(Object.fromEntries(s.data.map((x) => [x.start, x])));
  renderWeek();
  const thu = W.parse(W.add(monday, 3)); // 주가 걸친 달은 목요일 기준
  if (!cal || cal.wk !== monday) cal = { y: thu.getFullYear(), m: thu.getMonth() + 1, wk: monday };
  await loadCal();
  if (scrollToday) document.getElementById("d-" + today())?.scrollIntoView({ block: "start" });
}
// ── 📌 고정업무: 대표가 정한 목록 중 오늘 요일·주차에 해당하는 것만, 순서대로 ──
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const applies = (it, day) => { const d = W.parse(day); return it.days.includes(d.getDay()) && (!it.weeks || it.weeks.includes(Math.floor((d.getDate() - 1) / 7) + 1)); };
async function loadRoutine() {
  const day = today();
  const [r, c] = await Promise.all([sb.from("routine_items").select("*").order("sort").order("id"),
    myRole === "admin" ? sb.rpc("routine_status", { p_day: day }) : sb.rpc("team_routine_checks_on", { p_day: day, p_team: previewTeam })]);
  if (fail(r.error || c.error)) return;
  routine = r.data;
  const mine = routine.filter((it) => applies(it, day)), dw = W.parse(day).getDay();
  $("#rtTitle").textContent = `오늘(${DOW[dw]}) 고정업무`;
  if (myRole === "admin") { // 대표: 매니저별 오늘 진행 현황
    $("#rtCount").textContent = `${mine.length}개 · 지점별 현황`;
    $("#rtBar").parentElement.classList.add("hidden"); $("#rtList").innerHTML = "";
    $("#rtStatus").innerHTML = c.data.length ? `<table>${c.data.map((x) => { const pct = x.total ? Math.round((x.done / x.total) * 100) : 0;
      return `<tr><td><b>${esc(x.team)}</b> <span style="color:var(--sub)">${esc(x.members ?? "매니저 없음")}</span></td><td><div class="bar"><i style="width:${pct}%"></i></div></td><td class="n">${x.done}/${x.total}${x.total && x.done === x.total ? " 🎉 퇴근 가능" : ""}</td></tr>`; }).join("")}</table>`
      : `<div style="color:var(--sub);font-size:14px">지점이 없어요</div>`;
    return;
  }
  routineChecks = new Map(c.data.map((x) => [x.item_id, x])); // 지점 공용: 누가 언제 했는지
  const done = mine.filter((it) => routineChecks.has(it.id)).length;
  $("#routinebox").classList.toggle("hidden", !mine.length);
  $("#rtCount").textContent = `${done}/${mine.length}`;
  $("#rtBar").style.width = (mine.length ? Math.round((done / mine.length) * 100) : 0) + "%";
  $("#rtList").innerHTML = mine.map((it) => { const ck = routineChecks.get(it.id), at = ck && new Date(ck.done_at);
    return `<label class="rt ${it.color} ${ck ? "done" : ""}"><input type="checkbox" data-rt="${it.id}" ${ck ? "checked" : ""}>${ck ? `<b class="who" title="누르면 체크 해제">${esc(ck.done_name ?? "")} ✓ ${pad(at.getHours())}:${pad(at.getMinutes())}</b>` : ""}<span>${esc(it.title)}</span></label>`; }).join("")
    + (mine.length && done === mine.length ? `<div class="rtdone">🎉 오늘 고정업무를 모두 끝냈어요! 대표님께 보고하고 퇴근하세요</div>` : "");
  $("#rtStatus").innerHTML = "";
}
$("#rtList").addEventListener("change", async (e) => {
  const id = +e.target.dataset.rt; if (!id) return;
  const { error } = await sb.rpc("set_routine_done", { p_item: id, p_day: today(), p_done: e.target.checked, p_team: previewTeam });
  if (fail(error)) e.target.checked = !e.target.checked;
  loadRoutine();
});

async function rtSave(id, patch) { const { error } = await sb.from("routine_items").update(patch).eq("id", id); if (fail(error)) return; await loadRoutine(); renderRtEditor(); }

$("#rtRows").addEventListener("change", (e) => {
  const row = e.target.closest(".rtrow"), f = e.target.dataset.f; if (!row || !f) return;

  rtSave(+row.dataset.id, f === "weeks" ? { weeks: v ? v.split(",").map(Number) : null } : f === "title" ? { title: v.trim() || "(제목 없음)" } : { [f]: v });

$("#rtRows").addEventListener("click", async (e) => {
  const row = e.target.closest(".rtrow"); if (!row) return;
  const id = +row.dataset.id, it = routine.find((x) => x.id === id), i = routine.indexOf(it);
  if (e.target.dataset.dow !== undefined) {
    const d = +e.target.dataset.dow, days = it.days.includes(d) ? it.days.filter((x) => x !== d) : [...it.days, d];
    if (!days.length) return toast("요일을 하나 이상 골라 주세요");
    return rtSave(id, { days });
  }
  if (e.target.dataset.mv) { // 위·아래 이웃과 sort 교환
    const o = routine[i + +e.target.dataset.mv]; if (!o) return;
    await sb.from("routine_items").update({ sort: o.sort }).eq("id", it.id);
    return rtSave(o.id, { sort: it.sort });

  if (e.target.dataset.rm !== undefined && confirm(`"${it.title}" 고정업무를 지울까요?`)) {

    if (!fail(error)) { await loadRoutine(); renderRtEditor(); }

async function loadCal() {

    W.weeksOf(year).map((m) => {

    }).join("");

// 월간 달력용으로 날짜별 할 일·데드라인 모으기
function renderCal() {
  const byDay = {}, dlByDay = {};
  for (const t of calTasks) {
    (byDay[t.day] ??= []).push(t);
    if (t.deadline && !t.done) (dlByDay[W.ymd(new Date(t.deadline))] ??= []).push(t);
  }
  const hm = (iso) => { const d = new Date(iso); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  renderMonth(byDay, dlByDay, hm);
}

// 월간 보기: 일요일 시작, 칸마다 알약(할 일 보라 / ⏰데드라인 빨강·주황 / 완료 회색). 알약 = 상세, 빈 곳 = 그날 새 할 일
function renderMonth(byDay, dlByDay, hm) {
  const g = W.monthGrid(cal.y, cal.m, true), max = matchMedia("(max-width: 860px)").matches ? 3 : 4;
  const cells = g.map((day) => {
    const d = W.parse(day), out = d.getMonth() + 1 !== cal.m;
    const dls = (dlByDay[day] ?? []).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
    const list = (byDay[day] ?? []).filter((t) => t.title)
      .sort((a, b) => a.done - b.done || b.must_do - a.must_do || b.important - a.important || (a.start_time ?? "99").localeCompare(b.start_time ?? "99")); // 꼭·중요 먼저, 그다음 시작시간 순
    const pills = [
      ...dls.map((t) => `<button class="pill dl ${W.due(t.deadline).cls}" data-id="${t.id}">⏰${hm(t.deadline)} ${esc(t.title) || "(제목 없음)"}</button>`),
      ...list.map((t) => `<button class="pill ${t.done ? "x" : ""} ${!t.done && t.must_do ? "hot" : !t.done && t.important ? "imp" : ""}" data-id="${t.id}">${t.must_do ? "🔥" : ""}${t.important ? "⭐" : ""}${t.start_time ? t.start_time.slice(0, 5) + " " : ""}${esc(t.title)}</button>`),
    ];
    const il = `<span class="il">일</span>`; // 폰에선 숫자만 (아이폰 캘린더처럼)
    const num = day === today() ? `<b>${d.getDate()}</b>${il}` : d.getDate() === 1 ? `<span class="il">${d.getMonth() + 1}월 </span>1${il}` : `${d.getDate()}${il}`;
    return `<div class="dc ${out ? "out" : ""} ${d.getDay() % 6 === 0 ? "wkend" : ""}" data-day="${day}"><div class="dn">${num}</div>
      ${pills.slice(0, max).join("")}${pills.length > max ? `<div class="more">+${pills.length - max}<span class="il">개 더</span></div>` : ""}</div>`;
  }).join("");
  const html = `<div class="mh"><h1>${cal.y}년 ${cal.m}월</h1><div class="navs"><button data-cal="-1" aria-label="이전 달">‹</button><button data-cal="0">오늘</button><button data-cal="1" aria-label="다음 달">›</button></div></div>
    <div class="mgrid">${["일", "월", "화", "수", "목", "금", "토"].map((x) => `<div class="dow">${x}</div>`).join("")}${cells}</div>`;
  $("#monthView").innerHTML = html; $("#weekCal").innerHTML = html;
}

function chip(t) {
  if (!t.deadline) return `<button class="chip none" data-act="dl" title="데드라인">📅</button>`;
  const d = W.due(t.deadline), n = (t.deadline_log || []).length;

  return `<button class="${cls}" data-act="dl" title="데드라인 재설정">📅 ${fmtDl(t.deadline)}${t.done ? "" : " · " + d.text}${n ? `<span class="log">↻${n}</span>` : ""}</button>`;
}
// ── 수행시간 / 예상시간 ──
const pad = (n) => String(n).padStart(2, "0");
const elapsed = (t) => t.spent_sec + (t.started_at ? Math.max(0, (Date.now() - new Date(t.started_at)) / 1000) : 0);
function hms(sec, withSec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return withSec ? `${h}:${pad(m)}:${pad(sec % 60)}` : `${h}:${pad(m)}`; }
function timeBtn(t) {
  const run = !!t.started_at, sec = elapsed(t), est = t.estimate_min;
  if (t.done && !sec) return "";
  if (!run && !sec) return `<button class="tm none" data-act="timer" title="타이머 시작">▶</button>`;
  const over = est && sec > est * 60;
  return `<button class="tm ${run ? "run" : ""} ${over ? "over" : ""}" data-act="timer" data-tid="${t.id}" title="${t.done ? "수행시간" : run ? "타이머 정지" : "타이머 시작"}">${t.done ? "⏱" : run ? "⏸" : "▶"} <b>${hms(sec, run)}</b></button>`;
}
// 시작시간·예상시간 버튼 (누르면 작은 선택창)

}

function dragStart(e, t, src) {

function dragMove(e) {

  document.querySelectorAll(".drop").forEach((el) => el.classList.remove("drop"));
  drag.line?.remove(); drag.line = null;

    const rows = [...day.querySelectorAll(".row")].filter((r) => r !== drag.src);
    const before = rows.find((r) => { const b = r.getBoundingClientRect(); return drag.y < b.top + b.height / 2; });

function pillDown(e) {
  const pill = e.target.closest(".pill"); if (!pill) return;
  const t = calTasks.find((x) => x.id == pill.dataset.id); if (!t) return;
  const x0 = e.clientX, y0 = e.clientY;

  };

$("#sEst").onchange = () => sheetSave({ estimate_min: +$("#sEst").value > 0 ? Math.round(+$("#sEst").value) : null });
$("#sEstQ").onclick = (e) => { if (e.target.dataset.m === undefined) return; $("#sEst").value = e.target.dataset.m; $("#sEst").onchange(); };
$("#sTimer").onclick = () => toggleTimer(cur());
$("#sMarks").onclick = (e) => { const k = e.target.dataset.mk; if (k) sheetSave({ [k]: !cur()[k] }); };
$("#sSpentEdit").onchange = () => { // 타이머 깜빡했을 때 직접 고치기 (도는 중이면 멈춤)
  const m = +$("#sSpentEdit").value; if (!(m >= 0)) return;
  sheetSave({ spent_sec: Math.round(m * 60), started_at: null });
};
$("#sRemind").onchange = () => sheetSave({ remind_min: $("#sRemind").value === "" ? null : +$("#sRemind").value });
$("#sDl").onchange = () => sheetSave({ deadline: $("#sDl").value ? new Date($("#sDl").value).toISOString() : null });
async function moveAssigned(t, day) {
  const reason = (prompt(`📨 대표님이 배정한 일이에요.\n${md(t.day)} → ${md(day)}로 옮기는 사유를 적어 주세요`) || "").trim();
  if (reason.length < 2) { toast("사유가 있어야 날짜를 바꿀 수 있어요"); return false; }
  const { error } = await sb.rpc("move_assigned", { p_id: t.id, p_day: day, p_reason: reason });
  if (fail(error)) return false;
  toast(`${md(day)}로 옮기고 사유를 남겼어요`); return true;
}
$("#sDay").onchange = async () => {
  if (!$("#sDay").value) return;
  const t = cur();
  if (assignedToMe(t)) {
    if (await moveAssigned(t, $("#sDay").value)) { $("#sheet").close(); loadAll(); bumpStats(); } else $("#sDay").value = t.day;
    return;
  }
  const d = await save(openId, { day: $("#sDay").value });
  if (d) { $("#sheet").close(); loadAll(); bumpStats(); toast(`${md(d.day)}로 옮겼어요`); }
};
$("#sQuick").onclick = (e) => {
  const q = e.target.dataset.q; if (!q) return;
  const v = quickDl(cur(), q); sheetSave({ deadline: v ? v.toISOString() : null });
};
$("#sDel").onclick = async () => {
  if (!confirm("이 할 일을 삭제할까요?")) return;
  const { error } = await sb.from("tasks").delete().eq("id", openId);
  if (fail(error)) return;
  tasks = tasks.filter((t) => t.id !== openId); dues = dues.filter((t) => t.id !== openId); calTasks = calTasks.filter((t) => t.id !== openId);
  $("#sheet").close(); renderWeek(); renderCal(); bumpStats();
};
$("#sClose").onclick = () => $("#sheet").close();
$("#sheet").addEventListener("close", async () => {
  const t = cur(); openId = null;
  if (t && !$("#sTitle").value.trim() && !t.deadline && !$("#sNote").value.trim()) { // 월간에서 만들고 제목 없이 닫으면 지움
    await sb.from("tasks").delete().eq("id", t.id);
    tasks = tasks.filter((x) => x !== t); calTasks = calTasks.filter((x) => x !== t);
  }
  renderWeek(); renderCal();
  if (dirty) { dirty = false; softReload(); }
});


// ── 주 이동 ──
$("#prevW").onclick = () => { monday = W.add(monday, -7); year = W.isoWeek(monday).year; loadAll(); };
$("#nextW").onclick = () => { monday = W.add(monday, 7); year = W.isoWeek(monday).year; loadAll(); };
$("#todayBtn").onclick = () => {
  if (view === "month") { const t = W.parse(today()); cal = { ...cal, y: t.getFullYear(), m: t.getMonth() + 1 }; return loadCal(); }
  monday = W.monday(today()); year = W.isoWeek(today()).year; loadAll(true); };
$("#weeksBtn").onclick = () => { $("#weeks").classList.toggle("hidden-m"); $("#weeks .on")?.scrollIntoView({ block: "center" }); };
const hideM = document.createElement("style"); hideM.textContent = "@media (max-width:860px){.hidden-m{display:none}}"; document.head.append(hideM);

// ── 푸시 알람 ──
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
async function vapidPublic() { const { data, error } = await sb.rpc("vapid_public"); if (error || !data) throw new Error("알람 서버 준비 중이에요. 1분 뒤 다시 눌러 주세요"); return data; }
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
async function pushButton() {
  const btn = $("#pushBtn");
  if (!("serviceWorker" in navigator)) return btn.classList.add("hidden");
  const reg = await navigator.serviceWorker.ready;
  const sub = "PushManager" in window && (await reg.pushManager.getSubscription());
  btn.textContent = sub && Notification.permission === "granted" ? "🔔 알람 켜짐" : "🔔 알람 켜기";
  if (sub) await sb.from("push_subs").upsert({ endpoint: sub.endpoint, user_id: me.id, sub: sub.toJSON() }); // 계정 바뀌었을 때 대비
}
$("#pushBtn").onclick = async () => {
  if (isIOS && !standalone) return alert("아이폰은 홈 화면에 추가해야 알람이 와요.\n\n사파리 아래 [공유] 버튼 → [홈 화면에 추가] → 홈 화면의 '플래너' 아이콘으로 열고 다시 [알람 켜기]를 눌러 주세요.");
  if (!("PushManager" in window)) return alert("이 브라우저는 알람을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return alert("알림이 차단돼 있어요. 브라우저(또는 휴대폰) 설정에서 이 사이트 알림을 허용해 주세요.");
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(await vapidPublic()) }); }
    catch (e) { return alert(e.message); }
  }
  const { error } = await sb.from("push_subs").upsert({ endpoint: sub.endpoint, user_id: me.id, sub: sub.toJSON() });
  if (fail(error)) return;
  await reg.showNotification("🔔 알람이 켜졌어요", { body: "데드라인 알람이 이 기기로 와요", icon: "icon-192.png" });
  pushButton();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
sb.auth.onAuthStateChange((ev) => ev === "SIGNED_OUT" && location.reload());
boot();
</script>
